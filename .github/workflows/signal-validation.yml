name: Signal validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; main pushes always finish.
concurrency:
  group: signal-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and lint
        run: npm run check:pr
      - name: Score history recovery guardrails
        run: node scripts/backfill-signal-history-qa.mjs
      - name: Production build
        if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
        env:
          DATABASE_URL: postgresql://signal_ci:signal_ci@127.0.0.1:5432/signal_ci
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
