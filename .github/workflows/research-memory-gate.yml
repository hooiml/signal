name: Research Memory Gate

on:
  push:
    branches:
      - 'feat/research-memory-phases-1-6'
  workflow_dispatch:

jobs:
  verify-phase:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types scripts/research-memory-phase1-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase2-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase3-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase4-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase5-check.mjs
