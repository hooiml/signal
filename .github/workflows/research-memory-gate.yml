name: Research Memory Gate

on:
  push:
    branches:
      - 'feat/research-memory-phases-1-6'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/research-memory-phase1-check.mjs
      - run: npm run typecheck
      - run: npm run test:research
      - run: npm run build
