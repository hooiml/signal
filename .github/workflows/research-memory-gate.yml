name: Research Memory Gate

on:
  push:
    branches:
      - 'feat/research-memory-phases-1-6'
      - 'feat/research-memory-server-persistence'
      - 'feat/research-expectation-vs-reality'
      - 'feat/research-valuation-reasoning'
      - 'feat/research-decision-calibration'
      - 'feat/research-attention-engine'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://signal:signal@127.0.0.1:5432/signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/research-memory-phase1-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase2-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase3-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase4-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase5-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase6-check.mjs
      - run: node scripts/research-memory-integration-check.mjs
      - run: node scripts/research-memory-phase7-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase8-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase9-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase10-check.mjs
      - run: node --experimental-strip-types scripts/research-memory-phase11-check.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:research
      - run: npm run build
      - run: npx playwright install chromium
      - name: Run Phase 8-11 desktop/mobile browser QA
        shell: powershell
        run: |
          $process = Start-Process -FilePath "npm.cmd" -ArgumentList "start","--","-p","3000" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:3000/research" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Signal server did not become ready for browser QA." }
            node scripts/research-expectation-v8-qa.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/research-valuation-v9-qa.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/research-decision-calibration-v10-qa.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/research-attention-v11-qa.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
