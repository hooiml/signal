      ].filter(i => !q || i.title.toLowerCase().includes(q) || i.sub.toLowerCase().includes(q));
      window.__cmdItems = items;
      return `<div class="fixed inset-0 z-50 flex items-start justify-center pt-20 px-4 anim-fade" style="background:rgba(7,10,18,0.62);" onclick="closeCmd()">
        <div onclick="event.stopPropagation()" style="background:${t.surface};border:1px solid ${t.borderStrong};box-shadow:0 28px 72px rgba(0,0,0,0.45);" class="w-full max-w-[520px] rounded-2xl overflow-hidden anim-modal">
          <div class="px-4 py-3.5 flex items-center gap-3" style="border-bottom:1px solid ${t.border};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${t.muted}" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input id="cmd-input" value="${state.cmdQuery}" oninput="state.cmdQuery=this.value; render(); document.getElementById('cmd-input')?.focus();" placeholder="Jump to stock, MYR portfolio, quality tab, or lens..." style="color:${t.ink};" class="flex-1 bg-transparent border-0 outline-none text-sm" /><kbd style="background:${t.surfaceMuted};color:${t.inkSoft};" class="px-2 py-0.5 rounded text-[11px] font-bold">ESC</kbd></div>
          <div class="max-h-[340px] overflow-y-auto p-2 space-y-1">${items.map((item, i) => `<button onclick="window.__cmdItems[${i}].run()" style="background:transparent;" class="w-full text-left px-3 py-2.5 rounded-xl border-0 cursor-pointer flex items-center justify-between gap-3 hover:bg-white/5 smooth"><div><div style="color:${t.ink};" class="text-xs font-bold">${item.title}</div><div style="color:${t.muted};" class="text-xs mt-0.5">${item.sub}</div></div>${toneChip(item.kind, item.kind === 'Action' ? 'up' : 'neutral')}</button>`).join('')}</div>
        </div></div>`;
    }

    function render() {
      const t = T();
      document.body.style.background = t.bg;
      document.body.style.color = t.ink;

      const content = state.page === 'home' ? renderHomePage()
        : state.page === 'market' ? renderMarketPage()
        : state.page === 'portfolio' ? renderPortfolioPage()
        : state.page === 'discover' ? renderDiscoverPage()
        : renderResearchPage();

      document.getElementById('root').innerHTML = state.viewport === 'mobile'
        ? `${renderMobileShell(content)}${renderPeekDrawer()}${renderCompareModal()}${renderCmdModal()}${renderTourModal()}${renderSettingsDrawer()}`
        : `<div class="flex min-h-screen w-full" style="background:${t.bg};">
            ${renderSidebar()}
            <div class="flex-1 min-w-0 flex flex-col">
              ${renderTopBar()}
              <main class="flex-1 max-w-[1260px] w-full mx-auto px-5 md:px-8 py-5 md:py-6">${content}</main>
            </div>
          </div>
          ${renderCompareDock()}
          ${renderPeekDrawer()}
          ${renderCompareModal()}
          ${renderCmdModal()}
          ${renderTourModal()}
          ${renderSettingsDrawer()}`;
    }

    render();
  </script>
</body>
</html>
