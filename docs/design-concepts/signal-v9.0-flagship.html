    function setMktRange(r) { state.mktRange = r; state.hoverMktIdx = null; render(); }
    function setSimVix(v) { state.simVix = parseFloat(v); render(); }
    function togglePillar(id) { state.expandedPillar = state.expandedPillar === id ? null : id; render(); }
    function setDiscoverFilter(f) { state.discoverFilter = f; render(); }
    function toggleCompareSym(sym) {
      if (state.comparePair.includes(sym)) {
        state.comparePair = state.comparePair.filter(s => s !== sym);
      } else {
        if (state.comparePair.length >= 2) state.comparePair = [state.comparePair[1], sym];
        else state.comparePair = [...state.comparePair, sym];
      }
      render();
    }
    function openCompare() { if (state.comparePair.length === 2) { state.showCompareModal = true; render(); } }
    function closeCompare() { state.showCompareModal = false; render(); }
    function openResearch(sym) { state.activeStock = sym; state.page = 'research'; state.peekStock = null; state.cmdOpen = false; state.hoverStockIdx = null; render(); }
    function openPeek(sym) { state.peekStock = sym; render(); }
    function closePeek() { state.peekStock = null; render(); }
    function openCmd() { state.cmdOpen = true; state.cmdQuery = ''; render(); setTimeout(() => document.getElementById('cmd-input')?.focus(), 20); }
    function closeCmd() { state.cmdOpen = false; render(); }
    function setStockRange(r) { state.stockRange = r; state.hoverStockIdx = null; render(); }
    function setResearchTab(t) { state.researchTab = t; render(); }
    function setFinMode(m) { state.finChartMode = m; render(); }
    function setSelectedFy(yr) { state.selectedFy = yr; render(); }
    function setHighlightPeer(p) { state.highlightPeer = p; render(); }
    function saveNote(sym, val) { state.savedNotes[sym] = val; }

    window.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); state.cmdOpen ? closeCmd() : openCmd(); }
      if (e.key === 'Escape') {
        if (state.cmdOpen) closeCmd();
        else if (state.showCompareModal) closeCompare();
        else if (state.peekStock) closePeek();
      }
    });

    function computeScore() {
      const base = state.marketRegion === 'MY' ? 58 : 66;
      const delta = Math.round((15.4 - state.simVix) * 1.55);
      return Math.max(18, Math.min(92, base + delta));
    }

    function postureMeta(score) {
      const t = T();
      if (score >= 65) return {
        label: 'Constructive',
        tone: 'up', color: t.up, bright: t.upBright, soft: t.upSoft, border: t.upBorder, aurora: t.auroraUp,
        plain: 'Calm volatility and steady institutional positioning favor measured, staggered entries over defensive hedging.'
      };
      if (score < 40) return {
        label: 'Defensive',
        tone: 'down', color: t.down, bright: t.downBright, soft: t.downSoft, border: t.downBorder, aurora: t.auroraDown,
        plain: 'Elevated market stress and wider swings favor holding cash buffers and demanding wider margins of safety.'
      };
      return {
        label: 'Balanced',
        tone: 'warn', color: t.warn, bright: t.warnBright, soft: t.warnSoft, border: t.warnBorder, aurora: t.auroraNeutral,
        plain: 'Mixed crosscurrents across volatility and positioning call for patience and selective quality focus.'
      };
    }

    function fmtPrice(s) {
      return `${s.currency}${s.price.toFixed(2)}`;
    }

    function fmtPct(v) {
      return `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(2)}%`;
    }

    function sparkSvg(vals, isUp, w = 88, h = 30, uid = 'sp') {
      const t = T();
      const min = Math.min(...vals), max = Math.max(...vals);
      const span = max - min || 1;
      const pts = vals.map((v, i) => [
        2 + (i / (vals.length - 1)) * (w - 4),
        h - 4 - ((v - min) / span) * (h - 8)
      ]);
      const stroke = isUp ? t.upBright : t.downBright;
      const dLine = smoothPath(pts);
      const dArea = `${dLine} L ${pts[pts.length - 1][0].toFixed(1)},${h} L ${pts[0][0].toFixed(1)},${h} Z`;
      return `
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="overflow-visible">
          <defs>
            <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${stroke}" stop-opacity="0.28"/>
              <stop offset="100%" stop-color="${stroke}" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="${dArea}" fill="url(#${uid})" />
          <path d="${dLine}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="2.6" fill="${stroke}" />
        </svg>`;
    }

    function smoothPath(pts) {
      if (pts.length < 2) return '';
      let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const p3 = pts[Math.min(pts.length - 1, i + 2)];
        const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
        const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
        const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
        const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
      }
      return d;
    }

    function arcGaugeSvg(score, posture, size = 216) {
      const t = T();
      const cx = 110, cy = 104, r = 82;
      const startDeg = 180, endDeg = 0;
      const toRad = d => (d * Math.PI) / 180;
      const pt = deg => [cx + r * Math.cos(toRad(deg)), cy - r * Math.sin(toRad(deg))];
      const [sx, sy] = pt(180);
      const [ex, ey] = pt(0);
      const angle = 180 - (score / 100) * 180;
      const [kx, ky] = pt(angle);
      const arcLen = Math.PI * r;
      const dashOffset = arcLen * (1 - score / 100);
      const gradId = `gauge-grad-${state.theme}`;
      return `
        <svg width="${size}" height="${Math.round(size * 0.62)}" viewBox="0 0 220 132" class="overflow-visible">
          <defs>
            <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="${t.downBright}" />
              <stop offset="48%" stop-color="${t.warnBright}" />
              <stop offset="100%" stop-color="${t.upBright}" />
            </linearGradient>
            <filter id="orb-glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Track -->
          <path d="M ${sx} ${sy} A ${r} ${r} 0 0 1 ${ex} ${ey}" fill="none" stroke="${t.gaugeBg}" stroke-width="14" stroke-linecap="round" />
          <!-- Threshold ticks at 40 and 65 -->
          ${[40, 65].map(mark => {
            const a = 180 - (mark / 100) * 180;
            const x1 = cx + (r - 11) * Math.cos(toRad(a)), y1 = cy - (r - 11) * Math.sin(toRad(a));
            const x2 = cx + (r + 11) * Math.cos(toRad(a)), y2 = cy - (r + 11) * Math.sin(toRad(a));
            return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${t.surface}" stroke-width="2.5" opacity="0.9" />`;
          }).join('')}
          <!-- Luminous active arc -->
          <path d="M ${sx} ${sy} A ${r} ${r} 0 0 1 ${ex} ${ey}" fill="none" stroke="url(#${gradId})" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="${arcLen.toFixed(1)}" stroke-dashoffset="${dashOffset.toFixed(1)}" style="transition: stroke-dashoffset 280ms cubic-bezier(0.22,1,0.36,1);" />
          <!-- Glowing orb -->
          <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="9" fill="${posture.bright}" opacity="0.28" filter="url(#orb-glow)" />
          <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="6.5" fill="#ffffff" stroke="${posture.bright}" stroke-width="3.2" />
          <!-- Center Score -->
          <text x="${cx}" y="${cy - 12}" text-anchor="middle" fill="${t.ink}" font-size="42" font-weight="700" class="tnum display">${score}</text>
          <text x="${cx}" y="${cy + 9}" text-anchor="middle" fill="${t.muted}" font-size="12" font-weight="500" class="tnum">out of 100</text>
          <!-- End labels -->
          <text x="22" y="125" text-anchor="middle" fill="${t.sub}" font-size="11" font-weight="600" class="tnum">0</text>
          <text x="198" y="125" text-anchor="middle" fill="${t.sub}" font-size="11" font-weight="600" class="tnum">100</text>
        </svg>`;
    }

    function miniRingSvg(score, color, size = 44) {
      const t = T();
      const r = 17, c = 2 * Math.PI * r;
      const offset = c * (1 - score / 100);
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 44 44">
          <circle cx="22" cy="22" r="${r}" fill="none" stroke="${t.gaugeBg}" stroke-width="4.5" />
          <circle cx="22" cy="22" r="${r}" fill="none" stroke="${color}" stroke-width="4.5" stroke-linecap="round"
            stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 22 22)" />
          <text x="22" y="26" text-anchor="middle" fill="${t.ink}" font-size="12.5" font-weight="700" class="tnum">${score}</text>
        </svg>`;
    }

    function marketAreaChartSvg() {
      const t = T();
      const basePts = MARKET_SERIES[state.mktRange];
      const liveScore = computeScore();
      const ptsData = basePts.map((p, idx) => idx === basePts.length - 1 ? { ...p, val: liveScore } : p);
      const W = 540, H = 200, padL = 32, padR = 14, padT = 18, padB = 28;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const yFor = v => padT + ((100 - v) / 100) * plotH;
      const xFor = i => padL + (i / (ptsData.length - 1)) * plotW;
      const coords = ptsData.map((p, i) => [xFor(i), yFor(p.val)]);
      const posture = postureMeta(liveScore);
      const dLine = smoothPath(coords);
      const dArea = `${dLine} L ${coords[coords.length - 1][0].toFixed(1)},${(padT + plotH).toFixed(1)} L ${coords[0][0].toFixed(1)},${(padT + plotH).toFixed(1)} Z`;
      const activeIdx = state.hoverMktIdx !== null ? state.hoverMktIdx : ptsData.length - 1;
      const activePt = ptsData[activeIdx];
      const [ax, ay] = coords[activeIdx];
      const tipX = Math.min(W - 126, Math.max(padL, ax - 54));

      return `
        <div class="relative w-full">
          <svg viewBox="0 0 ${W} ${H}" class="w-full h-[200px] overflow-visible select-none"
            onmouseleave="state.hoverMktIdx=null; render();">
            <defs>
              <linearGradient id="mkt-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="${posture.bright}" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="${posture.bright}" stop-opacity="0.01"/>
              </linearGradient>
            </defs>
            <!-- Soft Regime Threshold Lines -->
            ${[65, 40].map(th => {
              const y = yFor(th);
              const label = th === 65 ? 'Constructive 65' : 'Defensive 40';
              const col = th === 65 ? t.up : t.down;
              return `
                <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${col}" stroke-opacity="0.25" stroke-dasharray="4 4" stroke-width="1" />
                <text x="${padL + 6}" y="${y - 5}" text-anchor="start" fill="${col}" font-size="10.5" font-weight="600" opacity="0.82">${label}</text>`;
            }).join('')}
            <!-- Y axis ticks -->
            ${[20, 50, 80].map(v => `<text x="${padL - 8}" y="${yFor(v) + 3}" text-anchor="end" fill="${t.sub}" font-size="10.5" class="tnum">${v}</text>`).join('')}
            <!-- Area + Smooth Curve -->
            <path d="${dArea}" fill="url(#mkt-fill)" />
            <path d="${dLine}" fill="none" stroke="${posture.bright}" stroke-width="2.75" stroke-linecap="round" />
            <!-- Hover Crosshair -->
            <line x1="${ax}" y1="${padT}" x2="${ax}" y2="${padT + plotH}" stroke="${t.borderStrong}" stroke-dasharray="3 3" stroke-width="1.2" />
            <circle cx="${ax}" cy="${ay}" r="8" fill="${posture.bright}" opacity="0.22" />
            <circle cx="${ax}" cy="${ay}" r="4.5" fill="#ffffff" stroke="${posture.bright}" stroke-width="2.6" />
            <!-- Floating Glass Tooltip -->
            <g transform="translate(${tipX.toFixed(1)}, ${Math.max(4, ay - 46).toFixed(1)})">
              <rect width="118" height="34" rx="9" fill="${t.tipBg}" />
              <text x="10" y="15" fill="${t.tipInk}" font-size="10.5" font-weight="600" opacity="0.72">${activePt.date} · ${activePt.origin === 'observed' ? 'Live' : 'Backfill'}</text>
              <text x="10" y="28" fill="${t.tipInk}" font-size="12" font-weight="700" class="tnum">Score ${activePt.val}/100</text>
            </g>
            <!-- X axis dates -->
            ${ptsData.map((p, i) => (i === 0 || i === Math.floor(ptsData.length / 2) || i === ptsData.length - 1)
              ? `<text x="${xFor(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === ptsData.length - 1 ? 'end' : 'middle'}" fill="${t.sub}" font-size="11">${p.date}</text>`
              : '').join('')}
            <!-- Invisible hover scrub columns -->
            ${ptsData.map((p, i) => {
              const step = plotW / (ptsData.length - 1);
              return `<rect x="${(xFor(i) - step / 2).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${plotH}" fill="transparent" class="cursor-crosshair"
                onmouseenter="state.hoverMktIdx=${i}; render();" />`;
            }).join('')}
          </svg>
        </div>`;
    }

    function stockAreaChartSvg(stock) {
      const t = T();
      const vals = stock.series[state.stockRange] || stock.series['3M'];
      const W = 620, H = 210, padL = 8, padR = 10, padT = 20, padB = 24;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const min = Math.min(...vals) * 0.985, max = Math.max(...vals) * 1.015;
      const span = max - min || 1;
      const xFor = i => padL + (i / (vals.length - 1)) * plotW;
      const yFor = v => padT + (1 - (v - min) / span) * plotH;
      const coords = vals.map((v, i) => [xFor(i), yFor(v)]);
      const isUp = vals[vals.length - 1] >= vals[0];
      const stroke = isUp ? t.upBright : t.downBright;
      const dLine = smoothPath(coords);
      const dArea = `${dLine} L ${coords[coords.length - 1][0].toFixed(1)},${(padT + plotH).toFixed(1)} L ${coords[0][0].toFixed(1)},${(padT + plotH).toFixed(1)} Z`;
      const idx = state.hoverStockIdx !== null ? state.hoverStockIdx : vals.length - 1;
      const [ax, ay] = coords[idx];
      const activeVal = vals[idx];
      const pctFromStart = ((activeVal - vals[0]) / vals[0]) * 100;
      const tipX = Math.min(W - 134, Math.max(padL, ax - 60));

      return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full h-[210px] overflow-visible select-none"
          onmouseleave="state.hoverStockIdx=null; render();">
          <defs>
            <linearGradient id="stk-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${stroke}" stop-opacity="0.28" />
              <stop offset="100%" stop-color="${stroke}" stop-opacity="0" />
            </linearGradient>
          </defs>
          <!-- Baseline dotted -->
          <line x1="${padL}" y1="${coords[0][1]}" x2="${W - padR}" y2="${coords[0][1]}" stroke="${t.borderStrong}" stroke-dasharray="4 4" stroke-width="1" />
          <path d="${dArea}" fill="url(#stk-fill)" />
          <path d="${dLine}" fill="none" stroke="${stroke}" stroke-width="2.75" stroke-linecap="round" />
          <line x1="${ax}" y1="${padT}" x2="${ax}" y2="${padT + plotH}" stroke="${t.borderStrong}" stroke-dasharray="3 3" stroke-width="1.2" />
          <circle cx="${ax}" cy="${ay}" r="8" fill="${stroke}" opacity="0.22" />
          <circle cx="${ax}" cy="${ay}" r="4.5" fill="#ffffff" stroke="${stroke}" stroke-width="2.6" />
          <g transform="translate(${tipX.toFixed(1)}, ${Math.max(4, ay - 46).toFixed(1)})">
            <rect width="126" height="34" rx="9" fill="${t.tipBg}" />
            <text x="10" y="15" fill="${t.tipInk}" font-size="11.5" font-weight="700" class="tnum">${stock.currency}${activeVal.toFixed(2)}</text>
            <text x="10" y="28" fill="${pctFromStart >= 0 ? '#34d399' : '#fb7185'}" font-size="10.5" font-weight="600" class="tnum">${fmtPct(pctFromStart)} over ${state.stockRange}</text>
          </g>
          ${vals.map((_, i) => {
            const step = plotW / (vals.length - 1);
            return `<rect x="${(xFor(i) - step / 2).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${plotH}" fill="transparent" class="cursor-crosshair"
              onmouseenter="state.hoverStockIdx=${i}; render();" />`;
          }).join('')}
        </svg>`;
    }

                </div>

            <!-- Quick Watchlist in Sidebar -->

                <div>
                  <div style="color:${t.ink};" class="text-2xl font-bold tnum display">${fmtPrice(s)}</div>
                  <div class="mt-1">${pctBadge(s.chgPct)}</div>
                </div>
                ${sparkSvg(s.spark, s.chgPct >= 0, 118, 40, 'peek-' + s.sym)}
              </div>

              <div class="grid grid-cols-2 gap-2.5">
                ${[
                  ['P/E Ratio', `${s.pe}×`],
                  ['FCF Yield', `${s.fcfYield.toFixed(2)}%`],
                  ['Op Margin', `${s.opMargin.toFixed(1)}%`],
                  ['Div Yield', `${s.divYield.toFixed(2)}%`]
                ].map(([k, v]) => `
                  <div style="background:${t.surfaceSub};border:1px solid ${t.border};" class="rounded-xl p-3">
                    <div style="color:${t.muted};" class="text-[11px]">${k}</div>
                    <div style="color:${t.ink};" class="text-sm font-bold tnum mt-0.5">${v}</div>
                  </div>`).join('')}
              </div>

              <div class="space-y-2">
                <div style="color:${t.sub};" class="text-[11px] font-bold uppercase tracking-wider">Quick Health Read</div>
                ${s.health.map(h => `
                  <div style="background:${t.surfaceSub};border:1px solid ${t.border};" class="rounded-xl p-3 space-y-1">
                    <div class="flex items-center justify-between">
                      <span style="color:${t.ink};" class="text-xs font-bold">${h.label}</span>
                      ${toneChip(h.status, h.tone)}
                    </div>
                    <div style="color:${t.muted};" class="text-xs leading-relaxed">${h.desc}</div>
                  </div>`).join('')}
              </div>

              <div style="background:${t.brandSoft};border:1px solid ${t.brandBorder};" class="rounded-2xl p-3.5 space-y-1">
                <div style="color:${t.brand};" class="text-[11px] font-bold uppercase tracking-wider">Your Saved Note</div>
                <div style="color:${t.inkSoft};" class="text-xs leading-relaxed">${state.savedNotes[s.sym] || s.note}</div>
              </div>
            </div>

            <div class="pt-4 flex items-center gap-2">
              <button onclick="openResearch('${s.sym}')" style="background:${t.pillBg};color:${t.pillInk};"
                class="flex-1 py-2.5 rounded-xl text-xs font-semibold cursor-pointer border-0">Open Full Research →</button>
            </div>
          </div>
        </div>`;
    }

    function renderCompareModal() {
      if (!state.showCompareModal || state.comparePair.length < 2) return '';
      const t = T();
      const a = STOCKS[state.comparePair[0]];
      const b = STOCKS[state.comparePair[1]];
      const rows = [
        { label: 'P/E Ratio (Lower = Cheaper)', av: a.pe, bv: b.pe, fmt: v => `${v}×`, max: Math.max(a.pe, b.pe, 45), lowerBetter: true },
        { label: 'Free Cash Flow Yield', av: a.fcfYield, bv: b.fcfYield, fmt: v => `${v.toFixed(2)}%`, max: 7 },
        { label: 'Operating Margin', av: a.opMargin, bv: b.opMargin, fmt: v => `${v.toFixed(1)}%`, max: 65 },
        { label: 'Dividend Yield', av: a.divYield, bv: b.divYield, fmt: v => `${v.toFixed(2)}%`, max: 7 },
        { label: '1-Year Return', av: a.y1Ret, bv: b.y1Ret, fmt: v => `+${v.toFixed(1)}%`, max: 80 }
      ];
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 anim-fade" style="background:rgba(7,10,18,0.55);" onclick="closeCompare()">
          <div onclick="event.stopPropagation()" style="background:${t.surface};border:1px solid ${t.borderStrong};box-shadow:0 24px 64px rgba(0,0,0,0.35);"
            class="w-full max-w-[680px] rounded-[28px] p-6 space-y-5 anim-modal">
            <div class="flex items-center justify-between">
              <div>
                <h2 style="color:${t.ink};" class="text-lg font-bold display m-0">Head-to-Head Comparison</h2>
                <p style="color:${t.muted};" class="text-xs m-0 mt-0.5">Visual financial & valuation battle</p>
              </div>
              <button onclick="closeCompare()" style="background:${t.surfaceMuted};color:${t.ink};" class="w-8 h-8 rounded-full border-0 cursor-pointer font-bold">✕</button>
            </div>

            <div class="grid grid-cols-2 gap-3">
              ${[a, b].map((s, idx) => `
                <div style="background:${t.surfaceSub};border:1px solid ${idx === 0 ? t.brandBorder : t.upBorder};" class="rounded-2xl p-3.5 flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    ${stockAvatar(s, 38)}
                    <div>
                      <div style="color:${t.ink};" class="text-sm font-bold">${s.sym}</div>
                      <div style="color:${t.muted};" class="text-xs">${s.name}</div>
                    </div>
                  </div>
                  <div class="text-right">
                    <div style="color:${t.ink};" class="text-sm font-bold tnum">${fmtPrice(s)}</div>
                    <div style="color:${s.chgPct >= 0 ? t.up : t.down};" class="text-xs font-semibold tnum">${fmtPct(s.chgPct)}</div>
                  </div>
                </div>`).join('')}
            </div>

            <div class="space-y-3.5">
              ${rows.map(r => {
                const aw = Math.min(100, Math.max(8, (r.av / r.max) * 100));
                const bw = Math.min(100, Math.max(8, (r.bv / r.max) * 100));
                return `
                  <div class="space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                      <span style="color:${t.brand};" class="font-bold tnum">${r.fmt(r.av)}</span>
                      <span style="color:${t.muted};" class="font-semibold">${r.label}</span>
                      <span style="color:${t.up};" class="font-bold tnum">${r.fmt(r.bv)}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                      <div style="background:${t.track};" class="h-2 rounded-full flex justify-end overflow-hidden">
                        <div style="width:${aw}%;background:${t.brand};" class="h-2 rounded-full"></div>
                      </div>
                      <div style="background:${t.track};" class="h-2 rounded-full overflow-hidden">
                        <div style="width:${bw}%;background:${t.upBright};" class="h-2 rounded-full"></div>
                      </div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>
        </div>`;
    }

    function renderCmdModal() {
      if (!state.cmdOpen) return '';
      const t = T();
      const q = state.cmdQuery.trim().toLowerCase();
      const items = [
        ...Object.values(STOCKS).map(s => ({
          kind: 'Stock', title: `${s.sym} · ${s.name}`, sub: `${s.flag} ${fmtPrice(s)} (${fmtPct(s.chgPct)}) · P/E ${s.pe}×`,
          run: () => openResearch(s.sym)
        })),
        { kind: 'Action', title: 'Stress-test Market Panic (VIX → 34)', sub: 'Jump to Market Pulse simulator at defensive stress', run: () => { state.page = 'market'; state.simVix = 34; closeCmd(); } },
        { kind: 'Action', title: 'Compare AAPL vs MSFT side-by-side', sub: 'Open visual head-to-head comparison modal', run: () => { state.comparePair = ['AAPL', 'MSFT']; state.showCompareModal = true; closeCmd(); } },
        { kind: 'Glossary', title: 'What is Free Cash Flow Yield?', sub: 'Annual free cash flow divided by market cap — higher means more real cash per dollar invested.', run: () => closeCmd() }
      ].filter(i => !q || i.title.toLowerCase().includes(q) || i.sub.toLowerCase().includes(q));

      window.__cmdItems = items;
      return `
        <div class="fixed inset-0 z-50 flex items-start justify-center pt-20 px-4 anim-fade" style="background:rgba(7,10,18,0.52);" onclick="closeCmd()">
          <div onclick="event.stopPropagation()" style="background:${t.surface};border:1px solid ${t.borderStrong};box-shadow:0 28px 72px rgba(0,0,0,0.4);"
            class="w-full max-w-[540px] rounded-3xl overflow-hidden anim-modal">
            <div class="px-4 py-3.5 flex items-center gap-3" style="border-bottom:1px solid ${t.border};">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${t.muted}" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
              <input id="cmd-input" value="${state.cmdQuery}" oninput="state.cmdQuery=this.value; render(); document.getElementById('cmd-input')?.focus();"
                placeholder="Jump to a stock, stress-test market, or search glossary..."
                style="color:${t.ink};" class="flex-1 bg-transparent border-0 outline-none text-sm" />
              <kbd style="background:${t.surfaceMuted};color:${t.muted};" class="px-2 py-0.5 rounded-md text-[11px] font-semibold">ESC</kbd>
            </div>
            <div class="max-h-[340px] overflow-y-auto p-2 space-y-1">
              ${items.map((item, i) => `
                <button onclick="window.__cmdItems[${i}].run()"
                  style="background:transparent;"
                  class="w-full text-left px-3 py-2.5 rounded-2xl border-0 cursor-pointer flex items-center justify-between gap-3 hover:bg-blue-500/10 smooth">
                  <div>
                    <div style="color:${t.ink};" class="text-xs font-bold">${item.title}</div>
                    <div style="color:${t.muted};" class="text-[11px] mt-0.5">${item.sub}</div>
                  </div>
                  ${toneChip(item.kind, item.kind === 'Stock' ? 'brand' : item.kind === 'Action' ? 'up' : 'neutral')}
                </button>`).join('')}
            </div>
          </div>
        </div>`;
    }

    function render() {
      const t = T();
      document.body.style.background = t.bg;
      document.body.style.color = t.ink;

      const content = state.page === 'home' ? renderHomePage()
        : state.page === 'market' ? renderMarketPage()
        : state.page === 'discover' ? renderDiscoverPage()
        : renderResearchPage();

      document.getElementById('root').innerHTML = `
        <div class="flex min-h-screen w-full" style="background:${t.bg};">
          ${renderSidebar()}
          <div class="flex-1 min-w-0 flex flex-col">
            ${renderTopBar()}
            <main class="flex-1 max-w-[1260px] w-full mx-auto px-5 md:px-8 py-6 md:py-7">
              ${content}
            </main>
          </div>
        </div>
        ${renderPeekDrawer()}
        ${renderCompareModal()}
        ${renderCmdModal()}
      `;
    }

    render();
  </script>
</body>
</html>
